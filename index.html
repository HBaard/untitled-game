<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Untitled Board Battler</title>
    <style>
      :root {
        --bg: #14111c;
        --panel: #221c30;
        --text: #e8e2f4;
        --accent: #c9a227;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 16px;
      }
      #board {
        width: min(576px, 100%);
        height: auto;
        image-rendering: pixelated;
        border: 3px solid var(--accent);
        cursor: pointer;
      }
      #status { min-height: 1.4em; text-align: center; }
      #battle {
        background: var(--panel);
        border: 1px solid var(--accent);
        padding: 12px 16px;
        border-radius: 8px;
        text-align: center;
        max-width: 576px;
      }
      button {
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--accent);
        border-radius: 6px;
        padding: 6px 14px;
        margin: 6px 4px 0;
        font: inherit;
        cursor: pointer;
      }
      button:hover { background: #33294a; }
      #spells {
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-width: 576px;
        width: 100%;
        padding: 10px 12px;
        background: var(--panel);
        border: 1px solid #8a5cd8;
        border-radius: 8px;
      }
      #spells[hidden] { display: none; }
      #spell-actions { display: flex; gap: 4px; }
      #spells button { margin: 0; border-color: #8a5cd8; }
      #spell-prompt { font-size: 14px; color: #d8c4ff; min-height: 1.2em; }
      #arena-overlay {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: rgba(8, 6, 14, 0.82);
      }
      #arena-overlay[hidden] { display: none; }
      .arena-box {
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-width: 100%;
        padding: 12px;
        background: var(--panel);
        border: 2px solid var(--accent);
        border-radius: 10px;
      }
      #arena {
        display: block;
        width: min(960px, calc(100vw - 60px));
        height: auto;
        image-rendering: pixelated;
      }
      .arena-help {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 8px 24px;
        font-size: 14px;
      }
      kbd {
        padding: 1px 6px;
        border: 1px solid var(--accent);
        border-radius: 4px;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <div id="status"></div>
    <canvas id="board"></canvas>
    <div id="spells" hidden>
      <div><strong id="spell-title">Spells</strong></div>
      <div id="spell-prompt"></div>
      <div id="spell-actions"></div>
    </div>
    <div id="battle" hidden>
      <div id="battle-text"></div>
    </div>
    <button id="new-game">New game</button>
    <div id="arena-overlay" hidden>
      <div class="arena-box">
        <canvas id="arena"></canvas>
        <div class="arena-help">
          <span>Light: <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move · <kbd>G</kbd> fire</span>
          <span>Dark: <kbd>I</kbd><kbd>J</kbd><kbd>K</kbd><kbd>L</kbd> move · <kbd>Ä</kbd> fire</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
